name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera progetto Xcode
        run: xcodegen generate

      - name: Compila (senza firma)
        run: |
          xcodebuild \
            -project Hexbreak.xcodeproj \
            -scheme Hexbreak \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crea IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hexbreak.app Payload/
          zip -qry Hexbreak.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hexbreak-ipa
          path: Hexbreak.ipa
